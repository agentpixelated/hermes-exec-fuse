name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install quality tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check __init__.py classifier.py compressor.py executor.py schemas.py state.py tests

      - name: Compile plugin
        run: python -m compileall -q __init__.py classifier.py compressor.py executor.py schemas.py state.py

      - name: Run tests
        run: pytest 2>&1 | tee pytest.log

      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: error
          retention-days: 3
